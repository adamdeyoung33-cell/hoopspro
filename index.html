<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoopTrack | Elite Practice Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide/dist/umd/lucide.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);

        }
        .orange-gradient {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
        }
        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;

            border-top-color: #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="orange-gradient text-white pt-8 pb-12 px-6 rounded-b-[2rem] shadow-lg sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-800 tracking-tight text-white">HoopTrack</h1>
                <p class="text-orange-100 opacity-90 text-sm font-medium">Handle Hard Better.</p>
            </div>
            <div class="flex gap-2">
                <button onclick="openModal('sync-modal')" class="p-2 bg-white/20 rounded-full hover:bg-white/30 transition-colors">

                    <i data-lucide="cloud" class="w-6 h-6"></i>
                </button>
                <button onclick="openModal('settings-modal')" class="p-2 bg-white/20 rounded-full hover:bg-white/30 transition-colors">
                    <i data-lucide="settings" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 -mt-6">
        
        <!-- Daily Inspiration -->
        <section class="glass-card rounded-2xl p-6 shadow-sm mb-6 border-l-4 border-orange-500 fade-in">
            <i data-lucide="quote" class="w-5 h-5 text-orange-500 mb-2 opacity-50"></i>
            <p id="daily-quote" class="text-slate-800 font-semibold italic text-lg leading-snug">
                "Loading inspiration..."
            </p>
            <p id="quote-author" class="text-slate-500 text-sm mt-2 font-bold uppercase tracking-wider">— Author</p>
        </section>


        <!-- Stats Grid -->
        <section class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                <p class="text-slate-400 text-xs font-bold uppercase">Total Makes</p>
                <h3 id="total-makes" class="text-2xl font-800 text-slate-800">0</h3>
            </div>
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                <p class="text-slate-400 text-xs font-bold uppercase">Avg Accuracy</p>
                <h3 id="avg-accuracy" class="text-2xl font-800 text-orange-600">0%</h3>
            </div>
        </section>

        <!-- Chart Section -->
        <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-700 text-slate-800">Progress</h2>
                <select id="chart-filter" onchange="updateChart()" class="text-xs font-bold bg-slate-100 px-2 py-1 rounded-lg outline-none text-slate-600 border-none">
                    <option value="all">All Drills</option>
                </select>

            </div>
            <div class="chart-container">
                <canvas id="progressChart"></canvas>
            </div>
        </section>

        <!-- Drills -->
        <section class="mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-800 text-slate-800">My Drills</h2>
                <button onclick="openModal('add-drill-modal')" class="text-sm font-bold text-orange-600 flex items-center gap-1 hover:scale-105 transition-transform">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Add New
                </button>
            </div>
            <div id="drills-list" class="space-y-4"></div>
        </section>
    </main>

    <!-- Bottom Nav -->

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-slate-900/90 backdrop-blur-lg rounded-full px-6 py-4 flex justify-around items-center shadow-2xl z-50">
        <button onclick="showSection('dashboard')" class="text-orange-500">
            <i data-lucide="layout-dashboard"></i>
        </button>
        <button onclick="openModal('log-session-modal')" class="bg-orange-500 p-4 rounded-full -mt-12 border-4 border-slate-50 shadow-lg text-white hover:bg-orange-600 transition-colors">
            <i data-lucide="plus" class="w-8 h-8"></i>
        </button>
        <button onclick="openModal('sync-modal')" class="text-slate-400">
            <i data-lucide="refresh-cw"></i>
        </button>
    </nav>

    <!-- Modal: Cloud Sync -->
    <div id="sync-modal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-800 text-slate-800 mb-2">Cloud Sync</h2>
            <p class="text-slate-500 text-sm mb-6">Use your Sync ID to keep devices together.</p>
            
            <div class="space-y-4">

                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase">Sync ID (Keep this secret)</label>
                    <div class="flex gap-2 mt-1">
                        <input id="sync-id-input" type="text" placeholder="Enter or Generate ID" class="flex-1 bg-slate-100 p-4 rounded-xl outline-none font-mono text-sm">
                        <button onclick="generateSyncId()" class="bg-slate-200 px-4 rounded-xl text-slate-600 font-bold text-xs">New</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-4">
                    <button id="push-btn" onclick="pushToCloud()" class="orange-gradient p-4 rounded-xl text-white font-bold flex flex-col items-center gap-1 shadow-md">
                        <i data-lucide="cloud-upload" class="w-5 h-5"></i>
                        <span class="text-xs">Push to Cloud</span>
                    </button>
                    <button id="pull-btn" onclick="pullFromCloud()" class="bg-slate-900 p-4 rounded-xl text-white font-bold flex flex-col items-center gap-1 shadow-md">
                        <i data-lucide="cloud-download" class="w-5 h-5"></i>
                        <span class="text-xs">Pull from Cloud</span>
                    </button>
                </div>
                <p id="sync-status" class="text-[10px] text-center text-slate-400 italic mt-2"></p>

            </div>
            <button onclick="closeModal('sync-modal')" class="w-full mt-6 p-4 text-slate-400 font-bold">Close</button>
        </div>
    </div>

    <!-- Modal: Add Drill -->
    <div id="add-drill-modal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-800 text-slate-800 mb-2">New Drill</h2>
            <input id="new-drill-name" type="text" placeholder="e.g. Corner 3s" class="w-full bg-slate-100 p-4 rounded-xl mb-4 outline-none font-medium">
            <div class="flex gap-4">
                <button onclick="closeModal('add-drill-modal')" class="flex-1 p-4 font-bold text-slate-400">Cancel</button>
                <button onclick="saveDrill()" class="flex-1 orange-gradient p-4 rounded-xl text-white font-bold">Add Drill</button>
            </div>
        </div>
    </div>

    <!-- Modal: Log Session -->
    <div id="log-session-modal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">

        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-800 text-slate-800 mb-2">Log Session</h2>
            <div class="space-y-4 mb-6">
                <select id="log-drill-select" class="w-full bg-slate-100 p-4 rounded-xl mt-1"></select>
                <div class="grid grid-cols-2 gap-4">
                    <input id="log-makes" type="number" placeholder="Makes" class="w-full bg-slate-100 p-4 rounded-xl">
                    <input id="log-misses" type="number" placeholder="Misses" class="w-full bg-slate-100 p-4 rounded-xl">
                </div>
                <input id="log-time" type="number" placeholder="Minutes" class="w-full bg-slate-100 p-4 rounded-xl">
            </div>
            <div class="flex gap-4">
                <button onclick="closeModal('log-session-modal')" class="flex-1 p-4 font-bold text-slate-400">Cancel</button>
                <button onclick="saveSession()" class="flex-1 orange-gradient p-4 rounded-xl text-white font-bold">Record Stats</button>
            </div>
        </div>
    </div>

    <!-- Modal: Settings -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">

        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-800 text-slate-800 mb-6">Settings</h2>
            <button onclick="exportData()" class="w-full p-4 bg-slate-100 rounded-xl font-bold flex justify-between mb-4">Export Backup <i data-lucide="download"></i></button>
            <button onclick="resetData()" class="w-full p-4 text-red-500 font-bold border border-red-100 rounded-xl">Reset All Data</button>
            <button onclick="closeModal('settings-modal')" class="w-full mt-6 p-4 text-slate-400 font-bold">Close</button>
        </div>
    </div>

    <script>
        const quotes = [
            { quote: "We all wait in life for things to get easier... It will never get easier. What happens is you handle hard better.", author: "Kara Lawson" },
            { quote: "Make yourself a person that handles hard stuff well.", author: "Kara Lawson" },
            { quote: "Confidence is the most important thing to bring each day.", author: "Kara Lawson" },
            { quote: "The big difference between a really good player and a great player is great players don’t get tired.", author: "Geno Auriemma" },
            { quote: "You don’t rise to the occasion; you sink to the level of your training.", author: "Geno Auriemma" },
            { quote: "Stick to what's real and true. Do the work.", author: "Kara Lawson" }
            // ... more quotes from previous list are implied
        ];


        let state = JSON.parse(localStorage.getItem('hooptrack_data')) || {
            drills: [{ id: 1, name: 'Free Throws', color: '#f97316' }],
            sessions: [],
            syncId: ''
        };

        let myChart = null;

        window.onload = () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            setRandomQuote();
            renderDrills();
            initChart();
            updateStats();
            populateDrillSelects();
            document.getElementById('sync-id-input').value = state.syncId || '';
        };

        function setRandomQuote() {

            const q = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('daily-quote').innerText = `"${q.quote}"`;
            document.getElementById('quote-author').innerText = `— ${q.author}`;
        }

        // --- Data Logic ---
        function saveState() {
            localStorage.setItem('hooptrack_data', JSON.stringify(state));
            updateStats();
            updateChart();
            renderDrills();
        }

        function saveDrill() {
            const name = document.getElementById('new-drill-name').value.trim();
            if (!name) return;
            state.drills.push({ id: Date.now(), name, color: `hsl(${Math.random()*360}, 70%, 50%)` });
            document.getElementById('new-drill-name').value = '';
            closeModal('add-drill-modal');

            populateDrillSelects();
            saveState();
        }

        function saveSession() {
            const drillId = parseInt(document.getElementById('log-drill-select').value);
            const makes = parseInt(document.getElementById('log-makes').value) || 0;
            const misses = parseInt(document.getElementById('log-misses').value) || 0;
            const time = parseInt(document.getElementById('log-time').value) || 0;
            state.sessions.push({ id: Date.now(), drillId, makes, misses, time, date: new Date().toISOString() });
            closeModal('log-session-modal');
            saveState();
        }

        // --- Cloud Sync Logic (Prototype using npoint.io) ---
        function generateSyncId() {
            const id = Math.random().toString(36).substring(2, 10).toUpperCase();
            document.getElementById('sync-id-input').value = id;
            state.syncId = id;

            saveState();
        }

        async function pushToCloud() {
            const syncId = document.getElementById('sync-id-input').value.trim();
            if (!syncId) return alert("Please enter or generate a Sync ID.");
            
            const btn = document.getElementById('push-btn');
            const status = document.getElementById('sync-status');
            btn.disabled = true;
            status.innerText = "Syncing to cloud...";

            try {
                // We use npoint.io as a lightweight JSON store
                const response = await fetch(`https://api.npoint.io{syncId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state)
                });

                if (response.ok) {
                    state.syncId = syncId;
                    saveState();
                    status.innerText = "Data saved to cloud successfully!";
                } else {
                    throw new Error();
                }
            } catch (e) {
                status.innerText = "Error pushing data. Try again later.";
            } finally {
                btn.disabled = false;
            }
        }

        async function pullFromCloud() {
            const syncId = document.getElementById('sync-id-input').value.trim();
            if (!syncId) return alert("Enter your Sync ID to download data.");

            const status = document.getElementById('sync-status');

            status.innerText = "Downloading from cloud...";

            try {
                const response = await fetch(`https://api.npoint.io{syncId}`);
                if (response.ok) {
                    const cloudState = await response.json();
                    if (confirm("Replace local data with Cloud version?")) {
                        state = cloudState;
                        saveState();
                        location.reload();
                    }
                } else {
                    status.innerText = "No data found for this Sync ID.";
                }
            } catch (e) {
                status.innerText = "Error pulling data.";
            }
        }


        // --- UI Rendering ---
        function renderDrills() {
            const container = document.getElementById('drills-list');
            container.innerHTML = state.drills.map(drill => {
                const ds = state.sessions.filter(s => s.drillId === drill.id);
                const makes = ds.reduce((sum, s) => sum + s.makes, 0);
                const atts = ds.reduce((sum, s) => sum + (s.makes + s.misses), 0);
                const acc = atts > 0 ? Math.round((makes / atts) * 100) : 0;
                return `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex items-center justify-between fade-in">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl flex items-center justify-center text-white font-black" style="background: ${drill.color}">${drill.name[0]}</div>
                            <div>
                                <h4 class="font-bold text-slate-800">${drill.name}</h4>
                                <p class="text-xs text-slate-400 font-bold">${acc}% Accuracy</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-lg font-800 text-slate-800">${makes}</p>

                            <p class="text-[10px] text-slate-400 font-bold uppercase">Makes</p>
                        </div>
                    </div>`;
            }).join('');
        }

        function updateStats() {
            const m = state.sessions.reduce((sum, s) => sum + s.makes, 0);
            const a = state.sessions.reduce((sum, s) => sum + (s.makes + s.misses), 0);
            document.getElementById('total-makes').innerText = m.toLocaleString();
            document.getElementById('avg-accuracy').innerText = `${a > 0 ? Math.round((m/a)*100) : 0}%`;
        }

        function populateDrillSelects() {
            const opts = state.drills.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
            document.getElementById('log-drill-select').innerHTML = opts;
            document.getElementById('chart-filter').innerHTML = `<option value="all">All Drills</option>` + opts;
        }


        function initChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [{ label: '%', data: [], borderColor: '#f97316', fill: true, tension: 0.4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
            updateChart();
        }

        function updateChart() {
            const filter = document.getElementById('chart-filter').value;
            let sessions = [...state.sessions];
            if (filter !== 'all') sessions = sessions.filter(s => s.drillId === parseInt(filter));
            const grouped = sessions.reduce((acc, s) => {
                const d = new Date(s.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                if (!acc[d]) acc[d] = { m: 0, a: 0 };
                acc[d].m += s.makes;
                acc[d].a += (s.makes + s.misses);

                return acc;
            }, {});
            myChart.data.labels = Object.keys(grouped);
            myChart.data.datasets[0].data = Object.values(grouped).map(g => Math.round((g.m/g.a)*100) || 0);
            myChart.update();
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function exportData() {
            const blob = new Blob([JSON.stringify(state)], { type: "application/json" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `hooptrack_backup.json`;
            link.click();
        }
        function resetData() { if (confirm("Clear all?")) { state = { drills: [], sessions: [] }; saveState(); location.reload(); } }
    </script>
</body>
</html>
