<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HoopsPro Elite</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- UI Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        
        :root {
            --primary: #ff5500;
            --bg: #050505;
            --card: #0f0f0f;

        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            color: #fff;
            -webkit-tap-highlight-color: transparent;
        }

        .hoops-card {
            background: var(--card);
            border: 1px solid #1a1a1a;
            border-radius: 30px;
        }

        .btn-main {
            background: var(--primary);
            color: white;
            font-weight: 700;

            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(255, 85, 0, 0.2);
        }

        .btn-main:active { transform: scale(0.96); }

        .hidden { display: none; }
        
        .status-pill {
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chart-container { position: relative; height: 220px; width: 100%; }
    </style>
</head>

<body class="max-w-md mx-auto min-h-screen flex flex-col p-6">

    <!-- Header -->
    <header class="flex justify-between items-start mb-8">
        <div>
            <h1 class="text-3xl font-bold italic tracking-tighter leading-none">HOOPSPRO <span class="text-orange-600">ELITE</span></h1>
            <div id="syncStatus" class="flex items-center gap-2 mt-4">
                <div id="statusDot" class="w-2 h-2 rounded-full bg-red-500"></div>
                <span id="statusLabel" class="status-pill bg-gray-900 text-gray-500">Connecting...</span>
            </div>
        </div>
        <button onclick="showPage('settings')" class="p-4 bg-zinc-900 rounded-2xl border border-zinc-800">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
        </button>
    </header>

    <main class="flex-1 pb-24">
        
        <!-- DASHBOARD PAGE -->

        <div id="page-dashboard">
            <section class="hoops-card p-7 mb-6 relative overflow-hidden">
                <span class="text-[10px] font-bold text-orange-600 uppercase tracking-widest block mb-4">Coach's Quote</span>
                <p id="quoteText" class="text-lg font-bold italic leading-tight">"..."</p>
                <p id="authorText" class="text-xs text-gray-500 mt-5 font-bold">— Kara Lawson</p>
            </section>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="hoops-card p-6 text-center">
                    <span class="text-[9px] text-gray-500 font-bold uppercase tracking-widest">Training Days</span>
                    <div id="statDays" class="text-5xl font-bold mt-2">0</div>
                </div>
                <div class="hoops-card p-6 text-center">
                    <span class="text-[9px] text-gray-500 font-bold uppercase tracking-widest">Total Makes</span>
                    <div id="statTotal" class="text-5xl font-bold mt-2 text-orange-500">0</div>
                </div>
            </div>

            <button onclick="showPage('log')" class="btn-main w-full py-6 text-xl mb-10 flex justify-center items-center gap-3">

                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"></path></svg>
                RECORD SESSION
            </button>

            <div class="hoops-card p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-xs uppercase tracking-widest text-gray-500">Analytics</h3>
                    <select id="graphFilter" onchange="updateChart()" class="bg-transparent text-orange-500 text-[10px] font-bold outline-none cursor-pointer">
                        <option value="Total">ALL DRILLS</option>
                    </select>
                </div>
                <div class="chart-container">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>
        </div>

        <!-- LOGGING PAGE -->
        <div id="page-log" class="hidden">

            <h2 class="text-4xl font-bold mb-10 tracking-tighter italic">Log Session</h2>
            <div id="drillInputs" class="space-y-4 mb-12"></div>
            <div class="flex gap-4">
                <button onclick="showPage('dashboard')" class="flex-1 py-5 bg-zinc-900 rounded-3xl font-bold text-gray-500 uppercase text-xs">Cancel</button>
                <button onclick="saveWorkout()" class="flex-1 py-5 btn-main rounded-3xl font-bold uppercase text-xs">Submit</button>
            </div>
        </div>

        <!-- SETTINGS PAGE -->
        <div id="page-settings" class="hidden">
            <h2 class="text-4xl font-bold mb-10 tracking-tighter italic">System</h2>
            
            <div class="hoops-card p-6 mb-6">
                <h3 class="text-orange-500 font-bold text-xs uppercase tracking-widest mb-4">Cloud Linking</h3>
                <p class="text-[10px] text-gray-500 mb-6">Enter your <b>Family Key</b> to sync results across devices.</p>
                <div class="flex gap-2">
                    <input type="text" id="familyKey" placeholder="e.g. MyFamilyHoops" class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 text-sm flex-1 outline-none focus:border-orange-500 transition-all">
                    <button onclick="saveKey()" class="px-6 btn-main rounded-2xl text-[10px]">SAVE</button>
                </div>

            </div>

            <div class="hoops-card p-6 mb-10">
                <h3 class="text-gray-500 font-bold text-xs uppercase tracking-widest mb-6">Manage Drills</h3>
                <div class="flex gap-2 mb-6">
                    <input type="text" id="newDrill" placeholder="Drill Name" class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 text-sm flex-1 outline-none">
                    <button onclick="addDrill()" class="px-6 btn-main rounded-2xl font-bold text-xl">+</button>
                </div>
                <ul id="drillList" class="space-y-3"></ul>
            </div>

            <button onclick="showPage('dashboard')" class="w-full py-5 bg-zinc-900 rounded-3xl font-bold text-xs uppercase text-gray-400">Back to Dashboard</button>
        </div>
    </main>

    <script>
        const QUOTES = [
            {q: "We all wait in life for things to get easier... It will never get easier. What happens is you handle hard better.", a: "Kara Lawson"},
            {q: "Make yourself a person that handles hard stuff well.", a: "Kara Lawson"},

            {q: "Great players don’t get tired.", a: "Geno Auriemma"},
            {q: "Average is always available. Greatness is not.", a: "Geno Auriemma"},
            {q: "You don’t rise to the occasion; you sink to the level of your training.", a: "Geno Auriemma"}
        ];

        // CONFIG UPDATED WITH USER KEYS
        const firebaseConfig = {
            apiKey: "AIzaSyBb_-4N9xnioprkZa6OLtOCUWg3iDvpVuY",
            authDomain: "hoopspro-227de.firebaseapp.com",
            projectId: "hoopspro-227de",
            storageBucket: "hoopspro-227de.firebasestorage.app",
            messagingSenderId: "647339514982",
            appId: "1:647339514982:web:9f5af3583d7253d0bfe1a7",
            measurementId: "G-NKY90WLSKD"
        };

        let state = {
            familyKey: localStorage.getItem('hoops_family_key') || '',
            drills: ["Form Shooting (10)", "Free Throws", "Mikan Drill"],

            history: []
        };
        let db = null;
        let chart = null;

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();

        window.onload = () => {
            loadLocal();
            initQuotes();
            if (state.familyKey) {
                document.getElementById('familyKey').value = state.familyKey;
                startSync();
            } else {
                updateStatus('offline');
            }
            refreshStats();

            updateChart();
        };

        function initQuotes() {
            const dayIdx = Math.floor(Date.now() / 86400000) % QUOTES.length;
            document.getElementById('quoteText').innerText = `"${QUOTES[dayIdx].q}"`;
            document.getElementById('authorText').innerText = `— ${QUOTES[dayIdx].a}`;
        }

        function showPage(p) {
            document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
            document.getElementById('page-' + p).classList.remove('hidden');
            if (p === 'log') renderDrillInputs();
            if (p === 'settings') renderDrillList();
        }

        function saveKey() {
            const val = document.getElementById('familyKey').value.trim();
            if (val) {

                state.familyKey = val;
                localStorage.setItem('hoops_family_key', val);
                startSync();
            }
        }

        function updateStatus(s) {
            const dot = document.getElementById('statusDot');
            const lbl = document.getElementById('statusLabel');
            if (s === 'online') {
                dot.className = 'w-2 h-2 rounded-full bg-green-500';
                lbl.innerText = "Online";
                lbl.className = 'status-pill bg-green-900/20 text-green-500';
            } else if (s === 'pending') {
                dot.className = 'w-2 h-2 rounded-full bg-yellow-500 animate-pulse';
                lbl.innerText = "Syncing...";
                lbl.className = 'status-pill bg-yellow-900/20 text-yellow-500';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-red-500';

                lbl.innerText = "Offline";
                lbl.className = 'status-pill bg-red-900/20 text-red-500';
            }
        }

        function startSync() {
            if (!db || !state.familyKey) return;
            updateStatus('pending');

            db.collection("trainers").doc(state.familyKey).onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    state.history = data.history || [];
                    state.drills = data.drills || state.drills;
                    saveLocal();
                    refreshStats();
                    updateChart();
                    updateStatus('online');
                } else {

                    pushToCloud();
                    updateStatus('online');
                }
            }, (error) => {
                console.error("Sync Error:", error);
                updateStatus('offline');
            });
        }

        function pushToCloud() {
            if (!db || !state.familyKey) return;
            db.collection("trainers").doc(state.familyKey).set({
                history: state.history,
                drills: state.drills,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function loadLocal() {

            const data = localStorage.getItem('hoops_local_data');
            if (data) {
                const parsed = JSON.parse(data);
                state.history = parsed.history || [];
                state.drills = parsed.drills || state.drills;
            }
        }

        function saveLocal() {
            localStorage.setItem('hoops_local_data', JSON.stringify(state));
            refreshStats();
        }

        function refreshStats() {
            const uniqueDays = new Set(state.history.map(h => h.date)).size;
            document.getElementById('statDays').innerText = uniqueDays;
            const total = state.history.reduce((acc, entry) => acc + Object.values(entry.data).reduce((a, b) => a + b, 0), 0);
            document.getElementById('statTotal').innerText = total;


            const filter = document.getElementById('graphFilter');
            const current = filter.value;
            filter.innerHTML = '<option value="Total">ALL DRILLS</option>';
            state.drills.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d; opt.innerText = d.toUpperCase();
                filter.appendChild(opt);
            });
            filter.value = state.drills.includes(current) ? current : "Total";
        }

        function renderDrillInputs() {
            const container = document.getElementById('drillInputs');
            container.innerHTML = state.drills.map(d => `
                <div class="hoops-card p-5 flex justify-between items-center border-l-4 border-orange-500">
                    <span class="font-bold text-[11px] uppercase tracking-widest text-zinc-500">${d}</span>
                    <input type="number" placeholder="0" data-drill="${d}" class="drill-input bg-black w-24 p-4 rounded-2xl border border-zinc-800 text-center text-orange-500 font-bold text-xl outline-none focus:border-orange-500 transition-all">
                </div>
            `).join('');

        }

        function saveWorkout() {
            const entry = { date: new Date().toISOString().split('T')[0], ts: Date.now(), data: {} };
            let totalInSession = 0;
            document.querySelectorAll('.drill-input').forEach(input => {
                const val = parseInt(input.value) || 0;
                if (val > 0) { entry.data[input.getAttribute('data-drill')] = val; totalInSession += val; }
            });

            if (totalInSession > 0) {
                state.history.push(entry);
                saveLocal();
                pushToCloud();
                showPage('dashboard');
                updateChart();
            } else {
                alert("Enter at least one score!");
            }

        }

        function updateChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const filter = document.getElementById('graphFilter').value;
            const recent = state.history.slice(-10);
            const labels = recent.map(h => h.date.split('-').slice(1).join('/'));
            const data = recent.map(h => filter === 'Total' ? Object.values(h.data).reduce((a, b) => a + b, 0) : (h.data[filter] || 0));

            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        data, borderColor: '#ff5500', backgroundColor: 'rgba(255, 85, 0, 0.05)',
                        fill: true, tension: 0.4, borderWidth: 4, pointRadius: 5, pointBackgroundColor: '#ff5500', pointBorderWidth: 0
                    }]
                },

                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { display: false, beginAtZero: true },
                        x: { grid: { display: false }, ticks: { color: '#444', font: { size: 9, weight: '700' } } }
                    }
                }
            });
        }

        function renderDrillList() {
            const list = document.getElementById('drillList');
            list.innerHTML = state.drills.map((d, i) => `
                <li class="flex justify-between items-center p-4 bg-zinc-900/50 rounded-2xl">
                    <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">${d}</span>
                    <button onclick="removeDrill(${i})" class="text-red-500 font-bold px-3">✕</button>
                </li>
            `).join('');

        }

        function addDrill() {
            const val = document.getElementById('newDrill').value.trim();
            if (val) {
                state.drills.push(val);
                document.getElementById('newDrill').value = '';
                saveLocal(); pushToCloud(); renderDrillList();
            }
        }

        function removeDrill(i) {
            state.drills.splice(i, 1);
            saveLocal(); pushToCloud(); renderDrillList();
        }
    </script>
</body>
</html>
